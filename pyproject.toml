[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw190521-reanalysis"
version = "0.2.2"
description = "Reproducible comparison of signal models for GW190521 using public GWOSC strain data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "BSD-3-Clause"}
authors = [{name = "Hemendra Singh"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<1.17",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "gwosc>=0.8,<1",
  "gwpy>=3.0,<4",
  "pycbc>=2.11,<3",
  "jupyterlab>=4,<5",
  "nbformat>=5,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
